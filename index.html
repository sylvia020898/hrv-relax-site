<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="description" content="A-HRV-RL：以心率變異度與強化學習打造的個人化舒壓與放鬆 IoT 系統。"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A-HRV-RL 研究網站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: same sidebar + search + two-level navigation; monochrome isometric line-art skin — white cards on a faint isometric grid, serif headlines with a grey second clause, black pill buttons */
:root{
  --bg:#F6F6F3;--side:#FFFFFF;--card:#FFFFFF;--fg:#0E0E0E;--muted:#4F4F4A;--line:#E3E3DE;--grid:rgba(20,20,20,.05);
  --tint:#F1F1ED;--tint-2:#E2E2DC;--ink-2:#2E2E2E;
  --accent:#141414;--accent-2:#000000;--accent-soft:#EFEFEB;--on-accent:#FFFFFF;--ink-btn:#141414;--btn-bg:#141414;--btn-fg:#FFFFFF;
  --pink:#141414;--pink-soft:#F1F1ED;--blue:#141414;--blue-soft:#F1F1ED;--green:#2E8A57;--green-soft:#F1F1ED;
  --orange:#AD640B;--orange-soft:#F1F1ED;--danger:#C2410C;
  --sim-bg:#FFFFFF;--sim-panel:#F4F4F0;--sim-fg:#141414;--sim-muted:#4F4F4A;--sim-grid:#E2E2DC;
  --shadow:none;
  --f-ui:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --f-display:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --r-lg:18px;--r-md:12px;
}
/* light-only by request: no dark theme */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);padding:28px 22px;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
.side,.results,.tblwrap,.formula{scrollbar-width:thin;scrollbar-color:transparent transparent}
.side:hover,.results:hover,.tblwrap:hover,.formula:hover{scrollbar-color:var(--line) transparent}
html{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-button{display:none;height:0;width:0}
::-webkit-scrollbar-thumb{background:transparent;border-radius:3px}
:hover::-webkit-scrollbar-thumb,html::-webkit-scrollbar-thumb{background:var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.2px}
.logo-mark{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.logo-mark svg{width:18px;height:18px;fill:var(--on-accent)}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;font-size:16px;font-weight:500;color:var(--fg)}
.nav-item:hover{background:var(--bg)}
.nav-item.on{color:var(--fg);font-weight:700}
.nav-item.on .ico{color:var(--accent)}
.friend{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px}
.friend:hover{background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--accent-soft)}
.av img{width:100%;height:100%;object-fit:cover}
.friend b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.friend small{display:block;font-size:12px;color:var(--muted)}
.side-foot{margin-top:auto}
.main{padding:24px 28px 56px;min-width:0;display:flex;flex-direction:column;gap:24px;max-width:1180px;width:100%}
.topbar{display:flex;gap:12px;align-items:center}
.menu-btn{display:none;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);place-items:center;flex:none}
.search{position:relative;flex:1}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 18px 0 46px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search .ico{position:absolute;left:17px;top:13px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:54px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:20;box-shadow:0 12px 32px rgba(25,20,60,.12);display:flex;flex-direction:column;max-height:360px;overflow-y:auto}
.results a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px}
.results a:hover,.results a.hl{background:var(--bg)}
.results small{color:var(--muted);display:block;font-size:12px}
.results .none{padding:12px;color:var(--muted)}

/* banner */
.banner{position:relative;overflow:hidden;background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:28px 32px 30px;display:flex;flex-direction:column;gap:14px}
.banner .eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;opacity:.9}
.banner h1{font-size:clamp(24px,3.2vw,34px);font-weight:700;max-width:620px;letter-spacing:-.3px;position:relative}
.banner p{max-width:560px;opacity:.92;position:relative}
.banner .stars{position:absolute;right:0;top:0;height:100%;width:min(55%,460px);pointer-events:none}
.btn-dark{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;background:var(--ink-btn);color:#FFFFFF;border-radius:999px;padding:8px 8px 8px 20px;font-weight:600;font-size:14px;position:relative}
.btn-dark span{width:30px;height:30px;border-radius:50%;background:#FFFFFF;color:#16161D;display:grid;place-items:center}
.btn-dark span .ico{width:16px;height:16px;stroke-width:2.4}

/* stat chips */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.stat{background:var(--card);border-radius:var(--r-lg);padding:14px 18px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.stat:hover{outline:1px solid var(--line)}
.bubble{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.stat small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:17px;font-weight:700}
.stat .go{margin-left:auto;color:var(--muted)}

/* section heads */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
.arrows{display:flex;gap:10px}
.arw{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--accent);border:1px solid var(--line)}
.arw.solid{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.arw .ico{width:16px;height:16px;stroke-width:2.2}
.see{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* course cards */
.panel{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,calc((100% - 40px)/3));gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.rail::-webkit-scrollbar{display:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.ccard{display:flex;flex-direction:column;gap:12px;scroll-snap-align:start;min-width:0;position:relative}
.cover{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;display:grid;place-items:center;max-width:100%}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .big{font-weight:700;font-size:28px;letter-spacing:-.5px;text-align:center;padding:0 16px;line-height:1.15}
.fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(20,20,30,.38);color:#FFFFFF;display:grid;place-items:center;z-index:2}
.fav .ico{width:16px;height:16px}
.fav[aria-pressed="true"] .ico{fill:#FFFFFF}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.4px;padding:4px 10px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.pill .ico{width:13px;height:13px}
.ccard h3{font-size:15.5px;font-weight:600;line-height:1.4;min-height:2.8em}
.ccard h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.track{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mentor{display:flex;align-items:center;gap:10px}
.mentor .av{width:32px;height:32px}
.mentor .av .ico{width:16px;height:16px}
.mentor b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.mentor small{display:block;font-size:12px;color:var(--muted)}

/* color sets */
.c-pink{--c:var(--pink);--cs:var(--pink-soft)}
.c-blue{--c:var(--blue);--cs:var(--blue-soft)}
.c-purple{--c:var(--accent);--cs:var(--accent-soft)}
.c-green{--c:var(--green);--cs:var(--green-soft)}
.c-orange{--c:var(--orange);--cs:var(--orange-soft)}
.tint{background:var(--cs);color:var(--c)}

/* table */
.tblwrap{overflow-x:auto;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
td{padding:14px 18px;border-bottom:1px dashed var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.lesson{display:flex;align-items:center;gap:12px;min-width:220px}
.lesson b{display:block;font-weight:600}
.lesson small{display:block;color:var(--muted);font-size:12px}
.go-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:inline-grid;place-items:center}
.go-btn .ico{width:14px;height:14px;stroke-width:2.2}
.tc{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* chapter pages */
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{opacity:.6}
.hero{border-radius:var(--r-lg);padding:28px 32px;display:flex;flex-direction:column;gap:12px;background:var(--cs)}
.hero h1{font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.3px;color:var(--fg)}
.hero p{color:var(--fg);opacity:.8;max-width:720px}
.hero .pill{background:var(--card);color:var(--c)}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.body{display:flex;flex-direction:column;gap:22px}
.body h2{font-size:19px;font-weight:700}
.lead{max-width:760px;font-size:16px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.box{background:var(--card);border-radius:var(--r-md);padding:20px 22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.box h3{font-size:16px;font-weight:700}
.box p,.box li{color:var(--fg);opacity:1;font-size:14.5px}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.box .n{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.kpi{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
.formula{background:var(--card);border-radius:var(--r-md);padding:18px 22px;font-weight:700;font-size:clamp(16px,2.2vw,22px);overflow-x:auto;white-space:nowrap;border-left:4px solid var(--accent)}
.note{font-size:13.5px;color:var(--muted)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure img{width:100%;border-radius:var(--r-md);aspect-ratio:4/3;object-fit:cover;background:var(--card)}
figure img.contain{object-fit:contain;aspect-ratio:auto}
figcaption{font-size:13px;color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:10px}
.layer{border-radius:var(--r-md);padding:16px 20px;display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:16px;align-items:center;background:var(--cs);border:1.5px solid var(--c)}
.layer b{color:var(--c);font-size:16px}
.layer span{font-size:14.5px}
.hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:center}
.hub .box{border:1.5px solid var(--c)}
.hub .center{grid-column:2;grid-row:1 / span 2;background:var(--accent);color:var(--on-accent);text-align:center;justify-content:center;min-height:220px}
.hub .center p{color:var(--on-accent);opacity:.9}
.hub .proto{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.5px}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.sw{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.sw i{display:block;height:84px}
.sw div{padding:14px 16px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.sw b{font-size:15px}
.chips{display:grid;grid-template-columns:2fr 4fr 4fr;gap:14px}
.chips .box{gap:10px}
.srow{display:flex;gap:6px}
.srow span{flex:1;text-align:center;font-weight:700;font-size:13px;border-radius:8px;padding:6px 0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pager a{background:var(--card);border-radius:var(--r-md);padding:16px 20px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.pager a:hover{outline:1px solid var(--accent)}
.pager small{color:var(--muted);font-size:12px}
.pager .next{text-align:right}
.diverge{display:flex;flex-direction:column;gap:10px}
.drow{display:grid;grid-template-columns:48px 1fr 2px 1fr;align-items:center;gap:0}
.drow b{font-size:14px}
.drow .axis{height:40px;background:var(--fg);opacity:.5}
.dbar{height:26px}
.drow .lbl{font-size:13px;font-weight:700;padding:0 8px;white-space:nowrap}

/* simulation */
.sim{background:var(--sim-bg);color:var(--sim-fg);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px}
.sim-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#clk{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sim-top .note{color:var(--sim-muted)}
.sim-btn{background:var(--sim-panel);color:var(--sim-fg);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600}
.sim-barwrap{position:relative;padding-bottom:26px}
.sim-bar{display:flex;border-radius:10px;overflow:hidden;height:58px}
.sg{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.25;color:#10162A;opacity:.38;transition:opacity .3s;border-right:2px solid var(--sim-bg);min-width:0;text-align:center}
.sg b{font-size:13px}
.sg.on{opacity:1}
#ph{position:absolute;top:-6px;width:4px;height:70px;margin-left:-2px;background:var(--sim-fg);border-radius:2px;box-shadow:0 0 10px var(--sim-fg)}
.mk{position:absolute;bottom:0;font-size:12px;color:#F0B45A;transform:translateX(-50%);white-space:nowrap}
.sim-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.sp{background:var(--sim-panel);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sp .t{font-size:12.5px;color:var(--sim-muted);font-weight:600}
.booth{position:relative;height:150px;display:flex;justify-content:center;align-items:center}
.led{position:absolute;top:8px;bottom:8px;width:12px;border-radius:6px;background:#E4E4DF}
#mon{width:62%;height:100px;background:#FFFFFF;border:3px solid #CFCFC8;border-radius:8px;display:grid;place-items:center;text-align:center;padding:6px}
#word{font-size:15px;color:var(--sim-muted);font-weight:700}
#hp{font-size:13px;text-align:center}
.scene{grid-column:1 / -1}
.scene-svg{width:100%;height:auto;display:block;border-radius:10px;font-family:var(--f-ui);max-width:100%}
.ledc{fill:#BDBDB5}
#ecg{width:100%;height:90px;display:block}
.vals{display:flex;gap:20px}
.vals small{display:block;font-size:12px;color:var(--sim-muted)}
.vals b{font-size:24px;font-variant-numeric:tabular-nums}
.qrow{display:grid;grid-template-columns:86px 1fr 46px;gap:8px;align-items:center;font-size:12.5px}
.qtrack{height:16px;border-radius:4px;background:#E4E4DF;overflow:hidden}
.qtrack i{display:block;height:100%;transition:width .5s}
.qrow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
#qs{font-size:12.5px;color:var(--sim-muted);white-space:pre-line;min-height:3.9em}
.sim-cap{background:var(--sim-panel);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px}
#pill{padding:3px 12px;border-radius:999px;color:#10162A;font-weight:700;white-space:nowrap}

/* isometric monochrome skin */
body{background-image:repeating-linear-gradient(30deg,var(--grid) 0 1px,transparent 1px 32px),repeating-linear-gradient(150deg,var(--grid) 0 1px,transparent 1px 32px)}
.c-pink,.c-blue,.c-purple,.c-green,.c-orange{--c:var(--fg);--cs:var(--tint)}
.stat,.panel,.box,.tblwrap,.sw,.pager a,.vid-ctl,.search input,.results,.hero{border:1px solid var(--line);box-shadow:none}
.pill{background:var(--card);border:1px solid var(--line);color:var(--fg);letter-spacing:.6px}
.nav-item.on{background:var(--tint)}
.nav-item.on .ico{color:var(--fg)}
.logo-mark{background:var(--fg)}
.logo-mark svg{fill:var(--card)}
.head h2,.body h2{font-family:var(--f-display);font-weight:700;font-size:27px;letter-spacing:-.2px}
.hero{background:var(--card);background-image:repeating-linear-gradient(30deg,var(--grid) 0 1px,transparent 1px 24px),repeating-linear-gradient(150deg,var(--grid) 0 1px,transparent 1px 24px)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,42px);letter-spacing:-.4px}
.hero p{opacity:1;color:var(--muted)}
.kpi{font-family:var(--f-display);font-weight:700;letter-spacing:-.5px;font-size:44px}
.cover{border:1px solid var(--line)}
.cover .big{font-family:var(--f-display);font-weight:700;font-size:32px}
.cover img,.av img,figure img{filter:grayscale(1) contrast(1.04);transition:filter .5s}
.ccard:hover .cover img,figure:hover img,.friend:hover .av img{filter:none}
.fav{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.fav[aria-pressed="true"] .ico{fill:currentColor}
.arw{color:var(--fg)}
.see{color:var(--fg)}
.go-btn{border-color:var(--fg);color:var(--fg)}
.layer{background:var(--card);border:1px solid var(--line)}
.layer b{color:var(--fg)}
.hub .box{border:1px solid var(--line)}
.hub .center{background:var(--card);color:var(--fg);border:2px solid var(--fg)}
.hub .center p{color:var(--fg)}
.sim{border:1px solid var(--line)}
.sim-panels{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.qtrack{background:var(--line)}
.formula{border-left-color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:clamp(18px,2.4vw,26px)}
.srow span{border:1px solid var(--line)}

body:'<p class="lead">每晚寫完作業，我會關掉大燈、只留書桌上的小黃燈、播放自己的音樂清單。有同學需要大白燈與快節奏音樂，也有人需要完全的黑暗與白噪音。每個人的「最適放鬆組合」並不一樣。</p>'+
'<div class="boxes"><div class="box"><small class="note">受試者 S01</small><div class="kpi" style="color:var(--green)">+17.71 ms</div><p>RMSSD 上升，放鬆效果顯著</p></div><div class="box"><small class="note">受試者 S02</small><div class="kpi" style="color:var(--orange)">−12.36 ms</div><p>RMSSD 下降，生理狀態更加緊繃</p></div></div>'+
'<p class="note">兩人接受的是同一個介入：A2 自然沉浸（自然環境音 + 綠白光）。RMSSD（連續心跳間期差異均方根）上升代表身體更放鬆。</p>'+
'<h2>研究問題</h2><div class="box"><p style="font-size:17px;opacity:1;font-weight:600">能不能設計一套系統，即時偵測使用者當下的生理回饋，動態演算出「此人、此時、此刻」最合適的放鬆輔助方案？</p></div>'},
tech:{t:"為什麼是強化學習 + HRV + IoT",d:"三個技術領域各負責一件事：學會選擇、量化放鬆、閉環執行。",big:"RL + HRV + IoT",min:2,kw:"強化學習 HRV IoT Edge 技術",
body:'<div class="boxes"><div class="box"><h3>強化學習 RL</h3><p>本質是透過「試誤」來優化決策：觀察使用者在不同狀態下的回饋，學習如何選擇動作以獲取最高長期獎勵，為每位使用者建立最合適的個人化介入路徑。</p></div>'+
'<div class="box"><h3>心率變異度 HRV</h3><p>RMSSD 是學界泛用的副交感神經活性指標，上升代表身體進入放鬆狀態。Polar H10 胸式心率帶提供 ms 級精度的逐拍 RR 資料，適合研究等級 HRV 分析。</p></div>'+
'<div class="box"><h3>物聯網 + 邊緣強化學習</h3><p>把感測器、運算單元、燈光、音訊整合成閉環系統：BLE 生理感測 + 藍牙音訊輸出，加上 GPIO 數位控制。為保護隱私，HRV 計算與 Q-learning 線上學習皆在本地完成。</p></div></div>'},
innov:{t:"本研究的四個創新點",d:"應用情境、系統整合、方法學反思與隱私保護。",big:"4 項創新",min:2,kw:"創新 隱私 方法學 N-of-1 精準醫療",
body:'<div class="boxes"><div class="box"><span class="n">01</span><h3>應用情境的創新</h3><p>把 RL 移植到「青少年舒壓與放鬆」這個真實生活問題，具備學校輔導室、休息室與家用部署的可行性。</p></div>'+
'<div class="box"><span class="n">02</span><h3>系統整合的創新</h3><p>在單一 Raspberry Pi 5 上同步整合 BLE 與藍牙音訊兩種無線協定，加上 GPIO 燈條控制，實現「感測—決策—執行」閉環自動化。</p></div>'+
'<div class="box"><span class="n">03</span><h3>方法學的反思</h3><p>從 Pilot 資料觀察到「行為-生理脫鉤」，將 reward 由「相對 stress」改為「相對 baseline」，定位從「壓力舒緩」轉為「放鬆增強」。</p></div>'+
'<div class="box"><span class="n">04</span><h3>隱私保護設計</h3><p>所有 HRV 與行為資料都在 Pi 5 本地處理、不上雲端；搭配傳輸、儲存、系統、治理四層資料安全設計。</p></div></div>'+
'<p class="lead">這些創新結合針對個人量身打造的 N-of-1 方法與適應性試驗設計，呼應精準醫療「因人而異」的精神。</p>'},
goals:{t:"四項具體研究目的",d:"系統實作、偵測模型、資料驗證、方法修正。",big:"4 項目的",min:2,kw:"研究目的 目標",
body:'<div class="boxes"><div class="box"><span class="n">目的 1</span><h3>系統實作</h3><p>整合 Polar H10、Raspberry Pi 5、WS2812 LED、SONY WH-CH520 的 IoT 即時生理回饋系統，具 22 分鐘 session 自動化執行能力，運算於 Pi 5 本地完成。</p></div>'+
'<div class="box"><span class="n">目的 2</span><h3>偵測模型</h3><p>4-arm Bandit 模型以 RMSSD 變化量為獎勵，透過 Q-learning 在 10 輪實驗內平衡「嘗試新方案」與「選擇最有感方案」，找出個人最適音光組合。</p></div>'+
'<div class="box"><span class="n">目的 3</span><h3>資料驗證</h3><p>ectopic beat 過濾、60 秒滑動視窗 RMSSD、reward 計算、stress manipulation 判定、quality grading 等完整驗證機制。</p></div>'+
'<div class="box"><span class="n">目的 4</span><h3>方法修正</h3><p>Stroop 於校園情境壓力誘發成功率僅 20%（1/5），獎勵改以受測者「日常基準」為比照，由被動「壓力舒緩」優化為主動「放鬆增強」。</p></div></div>'},

body:'<div class="tblwrap"><table><thead><tr><th>模組</th><th class="num" style="text-align:right">行數</th><th>主要職責</th></tr></thead><tbody>'+
[["gui_dashboard.py","1,168","PySide6 主 GUI；啟動 session、即時 HRV 顯示、Stroop 介面"],["main_session.py","455","22 分鐘 session 主控制器；依時間軸調度各階段事件"],["session_logger.py","668","資料 I/O 與 RMSSD / reward 計算；每場產出 11 個 CSV / JSON"],["rl_agent.py","253","Q-learning bandit；ε-greedy 三階段排程；Q-table 持久化"],["ble_reader.py","156","Polar H10 BLE 連線、斷線重連、RR callback 派送"],["actuator.py","82","Action → 硬體動作翻譯；同步控制燈光與音訊"],["led_control.py","118","WS2812 LED 控制（GPIO + neopixel + 30 ms 線性插值）"],["audio_player.py","69","pygame.mixer 音訊播放與 fade 控制（藍牙音訊）"]].map(function(r){return '<tr><td><code>'+r[0]+'</code></td><td class="num" style="text-align:right">'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join("")+
'</tbody></table></div><p class="note">在 AI 輔助工具支援下完成系統設計、模組切分、程式撰寫、debug 與多輪整合測試。</p>'},
arch:{t:"閉環式生理回饋：四個層次",d:"感測、運算、決策、執行四層形成完整回饋迴圈。",big:"4 層閉環",min:2,kw:"架構 閉環 感測 運算 決策 執行",
body:'<p class="lead">系統根據使用者的即時 HRV 反應動態調整音樂與燈光，並從每一次介入後的 HRV 變化中學習，讓後續介入越來越個人化。</p>'+
'<div class="layers"><div class="layer c-green"><b>執行層 Actuation</b><span>GPIO D10 控制 WS2812 燈條（色溫、亮度）與 pygame 音訊播放器（經 A2DP）同步切換；背景 thread 每 30 ms 線性插值，完成 5 秒 fade in/out。</span></div>'+
'<div class="layer c-orange"><b>決策層 Decision</b><span>4-arm Q-learning bandit 在每場 T = 8 分鐘決策點選擇 A1–A4，依 ε-greedy 三階段排程運作。</span></div>'+
'<div class="layer c-blue"><b>運算層 Computation</b><span>Pi 5 上的 Python 主程式計算 60 秒滑動視窗 RMSSD，執行 phase 切分、ectopic beat 過濾等邊緣運算。</span></div>'+
'<div class="layer c-pink"><b>感測層 Sensing</b><span>Polar H10 以藍牙低能耗（BLE）逐拍上傳 RR 間期至 Raspberry Pi 5。</span></div></div>'+
'<p class="note">資料由感測層往上流動到執行層；介入後的 HRV 變化再回饋給 RL agent，讓系統「學會」哪一個介入對使用者最有效。全部運算於 Raspberry Pi 5 本地完成，無雲端依賴。</p>'},
iot:{t:"IoT 多協定通訊與邊緣運算",d:"兩種無線協定 + GPIO，所有 HRV 與行為資料皆於本地處理。",img:"pi5",min:3,kw:"IoT BLE A2DP GPIO 邊緣運算 斷線 asyncio",
body:'<div class="hub"><div class="box c-pink"><span class="proto">BLE</span><h3>Polar H10 心率帶</h3><p>逐拍 RR 間期（ms 級精度）；bleak 非同步接收，事件驅動 callback</p></div>'+
'<div class="box center"><h3 style="font-size:22px">Raspberry Pi 5</h3><p>中央運算 / Edge RL</p><p>RL 決策、HRV 計算皆於本地完成，不上雲端</p></div>'+
'<div class="box c-orange"><span class="proto">GPIO D10</span><h3>WS2812 LED 燈條</h3><p>46 顆、GRB 色序、預設亮度 20%；Adafruit neopixel 函式庫</p></div>'+
'<div class="box c-green"><span class="proto">本地 USB</span><h3>PySide6 GUI</h3><p>Stroop 任務 + 即時 HRV 顯示</p></div>'+
'<div class="box c-purple"><span class="proto">藍牙 A2DP</span><h3>SONY WH-CH520</h3><p>4 種環境音樂 A1–A4；PulseAudio + pygame.mixer，5 秒 fade</p></div></div>'+
'<h2>邊緣運算與穩定性設計</h2><div class="boxes"><div class="box"><h3>為什麼選 Edge RL</h3><ul><li>隱私保護：HRV 與 Stroop 屬敏感生理／心理資料</li><li>延遲性：RL 決策需在 T = 8 分鐘準時觸發</li><li>可部署：Pi 5 約 NT$4,895，可在學校或家中獨立運作</li></ul></div>'+
'<div class="box"><h3>異步事件處理</h3><p>BLE 接收、Stroop GUI、LED 控制、音訊播放需同時運作，採 asyncio + threading 混合模型：bleak 在獨立 async loop，GUI 在主 thread，RL 與資料寫入在 worker thread。</p></div>'+
'<div class="box"><h3>斷線恢復機制</h3><ul><li>自動重連：未找到設備 5 秒、連線失敗 3 秒、錯誤 3 秒</li><li>斷線期間 session 計時器自動暫停</li><li>連線品質低於 80% → data_valid = false，Q-table 不更新</li></ul></div></div>'},
rl:{t:"Q-learning Bandit 與 Reward 設計",d:"四種音光 Action、更新規則、ε-greedy 三階段排程與 reward 公式重定義。",big:"α = 0.3",min:4,kw:"強化學習 Q-learning bandit epsilon greedy reward action A1 A2 A3 A4",
body:'<h2>Action Space：四種音光組合</h2><div class="swatches">'+
[["A1 專注鎮定","rgb(255,180,50)","暖橘 (255, 180, 50)","亮度 50%","focus_calm.mp3・低頻穩定背景音"],["A2 自然沉浸","rgb(200,255,200)","綠白 (200, 255, 200)","亮度 70%","nature.mp3・自然環境音（雨、鳥）"],["A3 能量流動","rgb(180,220,255)","冷白藍 (180, 220, 255)","亮度 80%","energy.mp3・中等節奏律動音"],["A4 暗光深層","rgb(42,14,8)","暗紅 (20, 5, 0)","亮度 10%","singing_bowl.mp3・頌缽冥想音"]].map(function(a){return '<div class="sw"><i style="background:'+a[1]+'"></i><div><b>'+a[0]+'</b><span>'+a[2]+'・'+a[3]+'</span><span class="note">'+a[4]+'</span></div></div>'}).join("")+'</div>'+
'<h2>為什麼用 Bandit 形式</h2><p class="lead">每人僅 10 場 session 的小樣本下，傳統具狀態空間的 Q-learning 易面臨 Q-table 稀疏而學習失效；Bandit 雖簡化，卻專注於預測當下最佳 Action，在有限數據下收斂性更佳。</p>'+
'<div class="formula">Q(a) ← Q(a) + α × (R − Q(a))，α = 0.3</div>'+
'<h2>ε-greedy 三階段排程</h2><div class="chips"><div class="box"><div class="srow"><span class="tint c-blue">S1</span><span class="tint c-blue">S2</span></div><h3>forced_base</h3><p>強制 A2 為控制基線，Q-table 不更新；受試者熟悉流程的緩衝期。</p></div>'+
'<div class="box"><div class="srow"><span class="tint c-orange">S3</span><span class="tint c-orange">S4</span><span class="tint c-orange">S5</span><span class="tint c-orange">S6</span></div><h3>forced_explore</h3><p>依固定順序 A1 → A2 → A3 → A4 強制探索，確保每個 arm 至少有一次經驗。</p></div>'+
'<div class="box"><div class="srow"><span class="tint c-green">S7</span><span class="tint c-green">S8</span><span class="tint c-green">S9</span><span class="tint c-green">S10</span></div><h3>ε-greedy 利用期（ε = 0.2）</h3><p>20% 機率隨機探索，80% 機率選擇 Q 值最大的 arm。</p></div></div>'+
'<h2>Reward 公式重定義</h2><div class="boxes"><div class="box"><small class="note">原始公式</small><div class="formula" style="border-color:var(--muted)">R = RMSSD_intervention − RMSSD_stress</div><p>預設「壓力期 RMSSD 必然降低」，但 pilot 發現 Stroop 在校園情境誘發成功率僅 20%（1/5）。</p></div>'+
'<div class="box"><small class="note">新公式（分析層）</small><div class="formula">R = RMSSD_intervention − RMSSD_baseline</div><p>不依賴壓力誘發是否成功，reward 的物理意義穩定；定位由「壓力舒緩」轉為「放鬆增強」。</p></div></div>'+
'<p class="note">程式即時運行時，Q-table 訓練訊號仍採舊公式；RMSSD_baseline 已完整記錄於 CSV，可事後以兩公式分別計算 reward 作為 sensitivity analysis 對照。</p>'},
flow:{t:"22 分鐘 Session 實驗流程",d:"六個階段的動畫示意，以及各階段對應的感測、運算與 IoT 動作。",big:"22 min",min:3,kw:"實驗流程 動畫 session 22 分鐘 baseline stress Stroop phase 時程",
body:'<div class="sim" id="sim"><div class="sim-top"><span id="clk">T = 00:00 / 22:00</span><span class="note">示意動畫・數值為模擬・約 44 秒播完一場</span><button class="sim-btn" id="simBtn" type="button">暫停</button></div>'+
'<div class="sim-barwrap"><div class="sim-bar" id="simBar"></div><div id="ph"></div><span class="mk" style="left:36.36%">★ T8 決策</span><span class="mk" style="left:81.8%">★ T18 更新</span></div>'+
'<div class="sim-panels"><div class="sp scene"><span class="t">實驗場景：灰色隔板半隔離艙</span>'+SCENE+'<div id="hp">耳機：靜音</div></div>'+
'<div class="sp"><span class="t">感測 + 運算：Polar H10 → RMSSD</span><canvas id="ecg"></canvas><div class="vals"><div><small>心率</small><b id="hr">74 bpm</b></div><div><small>RMSSD（60 s 視窗）</small><b id="rm">46.0 ms</b></div></div></div>'+
'<div class="sp"><span class="t">決策：4-arm Q-learning bandit</span><div id="qr"></div><div id="qs"></div></div></div>'+
'<div class="sim-cap"><span id="pill">基線期</span><span id="ct"></span></div></div>'+
'<h2>各階段對應</h2><div class="tblwrap"><table><thead><tr><th>階段</th><th>時間</th><th class="hide-sm">感測層</th><th>運算層</th><th>IoT 執行</th></tr></thead><tbody>'+
[["Baseline 基線期","T0–T3・3 min","BLE 接收 RR","RMSSD 中位數（整段 3 min）","環境靜默"],["Stress 壓力誘發","T3–T6・3 min","BLE + Stroop GUI","RMSSD 平均（僅 T4–T6）","GUI 顯示題目，無音訊"],["Decision 決策","T6–T8・2 min","BLE 持續","★ T8 RL agent 選 action","準備切換"],["Adapt 介入適應","T8–T11・3 min","BLE 持續","RMSSD 監測（不計入 reward）","燈光切換、音訊 fade-in"],["Effective 有效介入","T11–T18・7 min","BLE 持續","RMSSD 中位數（7 min 主訊號）","介入穩定播放 7 分鐘"],["End 結束","T18–T22・4 min","BLE 持續","★ T18 計算 reward、更新 Q-table","音訊 fade-out、燈光復原"]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td class="num" style="white-space:nowrap">'+r[1]+'</td><td class="hide-sm">'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>'}).join("")+'</tbody></table></div>'+
'<h2>兩個關鍵時序設計</h2><div class="boxes"><div class="box"><h3>RMSSD_stress 只取 T4–T6 的 120 秒</h3><p>而非整個 stress phase 180 秒，以排除剛進入 Stroop 任務時的注意力轉移（orienting response）。</p></div><div class="box"><h3>RMSSD_intervention 只取 T11–T18</h3><p>不含 adapt phase，以排除 LED 30 ms 線性插值與音訊 fade 的轉場過渡污染主訊號。</p></div></div>'},
design:{t:"N-of-1 個案系列與資料安全",d:"每位受試者進行 10 場 session 的個案系列設計，以及三層資料保護。",big:"N-of-1",min:3,kw:"研究設計 N-of-1 受試者 倫理 知情同意 資料安全 隱私 BFI-10 VAS",
body:'<div class="boxes"><div class="box"><div class="kpi" style="color:var(--accent)">N-of-1</div><p>健康青少年女性，16–18 歲在校學生</p></div><div class="box"><div class="kpi" style="color:var(--accent)">10 場 / 人</div><p>每位受試者進行 10 場 session，觀察個人化的收斂過程</p></div><div class="box"><div class="kpi" style="color:var(--accent)">VAS 0–100</div><p>每場後的最小化主觀放鬆評估</p></div></div>'+
'<div class="box"><ul><li>受試者與父母／監護人共同簽署知情同意書；任一階段皆可無條件退出，並要求刪除已蒐集資料。</li><li>事前向學校輔導室與老師報請審查：介入屬日常生活刺激、無侵入性、無藥物或醫療器材使用。</li><li>每場前 Stroop 校準建立個別認知能力基線；第 1 場填寫 BFI-10 簡短人格量表。</li><li>實驗於校內專屬空間進行，以灰色隔板圍成半隔離艙降低環境干擾。</li></ul></div>'+
'<p class="note">為保護受試者隱私，本網站不公開實驗執行時的人物照片。</p>'+
'<h2>資料安全：三層保護</h2><div class="boxes"><div class="box"><h3>傳輸層</h3><p>BLE 連線範圍小於 10 m，僅交換 RR 間期數據，無個人識別資訊傳輸；LED 由 Pi GPIO 控制，無網路通訊。</p></div><div class="box"><h3>儲存層</h3><p>11 個 CSV / JSON 資料檔以受試者編碼（S01、S02⋯）儲存，不含真實姓名；編碼對應表由研究者單獨保管於離線環境。</p></div><div class="box"><h3>治理層</h3><p>原始資料保留至實驗結束一年內，由指導老師見證下刪除；資料使用範圍限於本研究及後續學術發表。</p></div></div>'},
validate:{t:"九個資料驗證關卡",d:"每個關卡都有明確的設計理由，而非任意設定。",big:"9 關卡",min:3,kw:"驗證 ectopic RMSSD quality validity 資料檔 CSV",
body:'<div class="tblwrap"><table><thead><tr><th>驗證關卡</th><th>機制</th><th>設計理由</th></tr></thead><tbody>'+
[["Ectopic beat 過濾","|ΔRR| > 200 ms → 滑動視窗中位數取代","依臨床標準排除異常心跳所造成的 RMSSD 計算誤差"],["RMSSD 計算窗","60 秒滑動視窗","對齊 Task Force 1996 short-term HRV 標準"],["RMSSD_baseline","phase 內 60 s 樣本中位數","基線期穩定，中位數對偶發 outlier 較穩健"],["RMSSD_stress","T4–T6 間 120 s 滑動視窗均值","排除剛進入 Stroop 時的 orienting response 干擾"],["RMSSD_intervention","T11–T18 60 s 樣本中位數","排除 adapt phase 的轉場過渡污染主訊號"],["Stress manipulation 閾值","ratio > 10%（嚴格大於）","相對比率對基線不同的個體更公平；對應文獻常見有效誘發閾值"],["Reward 主訊號 + baseline 紀錄","主訊號 intervention − stress；baseline 記錄於 session_log.csv","後續 sensitivity analysis 可比較兩種 framework"],["Quality grading","A / B / C / D 自動分級","綜合 ectopic 比率、斷線時長、stress 是否成功"],["Data validity flag","valid_rr / total_rr ≥ 80%","低於此值則 Q-table 不更新，避免污染 RL 學習"]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1].replace(">","&gt;")+'</td><td>'+r[2]+'</td></tr>'}).join("")+'</tbody></table></div>'+
'<p class="note">每場 session 自動產出 11 個資料檔，包含 raw_rr.csv、session_log.csv、qtable_log.csv、qtable_before / after.json、decision_log.csv、stress_result.csv、stress_zscore.csv、calibration_log.csv、calibration_summary.csv、pause_events.csv。</p>'},
build:{t:"實驗控制面板與 LED 通道測試",d:"PySide6 控制面板與 WS2812 燈條 RGB／白光測試。",img:"panel",min:1,kw:"控制面板 GUI LED 測試 成果",
body:'<figure><img class="contain" src="'+IMG.panel+'" alt="實驗控制面板截圖：BLE 連線、Session 管理、音樂播放、燈光控制與系統日誌"><figcaption>實驗控制面板：BLE 連線、Session 管理、數據歷史、音樂播放（A1–A4）、燈光一鍵切換與系統日誌</figcaption></figure>'+
'<div class="figs"><figure><img src="'+IMG.led_b+'" alt="LED 燈條藍色通道測試"><figcaption>LED 通道測試：B 藍</figcaption></figure><figure><img src="'+IMG.led_g+'" alt="LED 燈條綠色通道測試"><figcaption>LED 通道測試：G 綠</figcaption></figure><figure><img src="'+IMG.led_r+'" alt="LED 燈條紅色通道測試"><figcaption>LED 通道測試：R 紅</figcaption></figure><figure><img src="'+IMG.led_w+'" alt="LED 燈條白光通道測試"><figcaption>LED 通道測試：W 白</figcaption></figure></div>'},
pilot:{t:"Pilot 階段：兩個可行性訊號",d:"Pilot 資料顯示跨個案差異，以及校園情境的壓力誘發成功率僅 20%。",big:"20%",min:2,kw:"pilot 初步 觀察 成功率 Prinsloo 脫鉤",
body:'<p class="note">本節呈現方法層次的描述性訊號，作為個人化方法可行性的依據。</p>'+
'<h2>一、跨個案差異：同一個 A2，方向相反</h2><div class="box"><div class="diverge">'+
'<div class="drow"><b>S01</b><span></span><span class="axis"></span><span style="display:flex;align-items:center"><i class="dbar" style="width:100%;background:var(--green);border-radius:0 6px 6px 0;max-width:calc(100% - 140px)"></i><span class="lbl" style="color:var(--green)">+17.71 ms 放鬆增強</span></span></div>'+
'<div class="drow"><b>S02</b><span style="display:flex;align-items:center;justify-content:flex-end"><span class="lbl" style="color:var(--orange)">−12.36 ms 更緊繃</span><i class="dbar" style="width:70%;background:var(--orange);border-radius:6px 0 0 6px"></i></span><span class="axis"></span><span></span></div></div>'+
'<p>S01 的 baseline RMSSD 約 70 ms（高 HRV 族群），S02 約 28–47 ms（中 HRV 族群），兩人對 A2 自然沉浸與 A1 專注鎮定的反應截然不同。個體差異無法以單一通用方法處理，這正是 RL bandit 在線上為個別使用者偵測最適 action 的設計目的。</p></div>'+
'<h2>二、壓力誘發成功率僅 20%（1/5）</h2><div class="box"><p>Stroop 任務在校園情境並不總能誘發 RMSSD 下降。這與 Prinsloo et al.（2011）等文獻吻合：年輕女性、HRV 基線偏高的族群，在實驗室誘發 paradigm 中常出現「行為層有壓力反應，生理層卻鈍化或反向」的脫鉤現象，顯示 Stroop 在校園情境的生態效度受限，因此促成 reward 公式重定義。</p></div>'},
future:{t:"後續方法與執行規劃",d:"擴充資料、LMM 統計、人格互動分析與收斂視覺化。",big:"4 個方向",min:2,kw:"後續 規劃 LMM BFI-10 統計 收斂",
body:'<div class="boxes"><div class="box"><span class="n">步驟 1</span><h3>擴充資料規模</h3><p>以相同的 22 分鐘 session 時序、Stroop 任務與 4-arm action space 擴充受試者與場次，確保資料可跨受試者比較。</p></div>'+
'<div class="box"><span class="n">步驟 2</span><h3>主要 outcome 推論統計</h3><p>以新公式 reward 為主要 outcome，於累積的 session 資料上執行線性混合效應模型（LMM），檢驗個別化 Q-table 收斂之顯著性與效果量；以舊公式作 sensitivity analysis。</p></div>'+
'<div class="box"><span class="n">步驟 3</span><h3>BFI-10 人格 × 介入互動</h3><p>檢視 extraversion、neuroticism 等個人特質如何調節 RL 收斂行為與個別最適 action 選擇。</p></div>'+
'<div class="box"><span class="n">步驟 4</span><h3>個別化收斂模式視覺化</h3><p>呈現每位受試者各自的 Q-table 演進軌跡與收斂曲線，作為「同一系統對不同個體之適應性」的具體展示。</p></div></div>'},
pod:{t:"未來產品想像：會讀心跳的舒壓艙",d:"戴上手腕心率帶、轉旋鈕，剩下交給五感：燈光、音樂、香氛與按摩依心跳自動調整。",big:"舒壓艙",min:3,kw:"未來 產品 想像 舒壓艙 放鬆艙 概念 拆解 爆炸圖 漫畫 香氛 按摩 旋鈕 手腕心率帶",
body:'<p class="lead">把實驗裡的隔板、心率帶、LED 燈條與耳機，整合成一座傾斜的蛋形舒壓艙：戴上手腕心率帶、躺進艙內、轉動扶手旋鈕，主控板持續計算 RMSSD，自動調整燈光、音樂、香氛與按摩。</p><p class="note">概念想像，非現有產品；圖中數值為示意。</p>'+
'<h2>舒壓艙怎麼用</h2><div class="boxes">'+[["1","戴上手腕心率帶","走到艙旁先戴好心率帶，系統用藍牙自動連線。"],["2","躺進艙內，轉旋鈕開始","轉動扶手旋鈕選擇自動或手動模式，狀態燈亮起。"],["3","依心跳啟動五感","主控板持續計算 RMSSD，調整燈光、音樂、香氛與按摩。"],["4","結束並記錄","狀態燈顯示這次的放鬆變化；系統記下哪個情境最有效，下次優先使用。"]].map(function(r){return '<div class="box"><span class="n">步驟 '+r[0]+'</span><h3>'+r[1]+'</h3><p>'+r[2]+'</p></div>'}).join("")+'</div>'+
'<div class="head"><h2>想像漫畫：下班後的十五分鐘</h2><button class="btn-line" id="podPlay" type="button">暫停漫畫</button></div>'+
'<div class="comic"><svg id="podComic" viewBox="0 0 960 600" role="img" aria-label="四格漫畫：一、上班族晚上八點下班，疲憊緊繃；二、戴上手腕心率帶、躺進舒壓艙、轉動旋鈕；三、穹頂關上，AI 選擇 A2，燈光、音樂、香氛與按摩自動啟動；四、十五分鐘後睡著，放鬆紀錄顯示 RMSSD 上升">'+comicSVG()+'</svg></div>'+
'<div class="head"><h2>3D 拆解圖</h2><div class="ex-ctl"><span>組合</span><input id="podSlider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="拆解程度"><span>拆解</span><button class="btn-line" id="podAuto" type="button">停止自動</button></div></div>'+
'<div class="panel exwrap"><svg id="podEx" class="iso-svg" viewBox="-320 -640 820 880" role="img" aria-label="舒壓艙 3D 拆解圖：透明穹頂、LED 燈帶、喇叭與香氛出口、躺椅內襯與扶手旋鈕、按摩模組、蛋形艙體、主控板、十字底座，另有藍牙手腕心率帶"></svg></div>'+
'<h2>零件與目前系統的對應</h2><div class="tblwrap"><table><thead><tr><th>零件</th><th>對應目前實驗系統</th><th>在舒壓艙裡的角色</th></tr></thead><tbody>'+
[["① 透明穹頂","灰色隔板半隔離艙","可開合，遮光又有包覆感"],["② LED 燈帶","WS2812 LED 燈條（46 顆）","沿艙口一圈，依情境切換色溫與亮度"],["③ 喇叭 ×2・香氛出口","SONY WH-CH520 藍牙耳機","不用戴耳機也能聽音樂；新增香氛"],["④ 躺椅內襯・扶手旋鈕","GUI 控制面板","轉旋鈕選自動或手動，狀態燈顯示模式"],["⑤ 按摩模組","—（新增）","背部滾輪與腿部氣囊"],["⑥ 蛋形艙體","書桌與椅子","傾斜包覆式躺姿，姿勢更穩定"],["⑦ 主控板","Raspberry Pi 5","持續計算 RMSSD，本地 Edge RL，資料不上雲端"],["⑧ 十字底座","—","四腳支撐，穩定不晃動"],["手腕心率帶","Polar H10 胸式心率帶","藍牙連線，戴在手腕更方便"]].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join("")+'</tbody></table></div>'},
refs:{t:"參考資料",d:"與本研究核心方法直接相關的關鍵文獻。",big:"7 篇文獻",min:1,kw:"參考資料 文獻 references",
body:'<div class="box"><ul style="gap:12px">'+
['<b>[核心]</b> Task Force of the European Society of Cardiology and the North American Society of Pacing and Electrophysiology (1996). Heart rate variability: standards of measurement, physiological interpretation, and clinical use. <i>Circulation, 93</i>(5), 1043–1065.',
'<b>[核心]</b> Sutton, R. S., &amp; Barto, A. G. (2018). <i>Reinforcement Learning: An Introduction</i> (2nd ed.). MIT Press.',
'<b>[核心]</b> Prinsloo, G. E., Rauch, H. G. L., Lambert, M. I., Muench, F., Noakes, T. D., &amp; Derman, W. E. (2011). The effect of short duration heart rate variability (HRV) biofeedback on cognitive performance during laboratory induced cognitive stress. <i>Applied Cognitive Psychology, 25</i>(5), 792–801.',
'<b>[核心]</b> Lehrer, P. M., &amp; Gevirtz, R. (2014). Heart rate variability biofeedback: how and why does it work? <i>Frontiers in Psychology, 5</i>, 756.',
'Stroop, J. R. (1935). Studies of interference in serial verbal reactions. <i>Journal of Experimental Psychology, 18</i>(6), 643–662.',
'<b>[核心]</b> Schork, N. J. (2015). Personalized medicine: Time for one-person trials. <i>Nature, 520</i>(7549), 609–611.',
'Polar Electro Oy. Polar H10 user manual &amp; technical specifications. Polar Electro Oy.'].map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div>'}
};
var GL={
"g-hrv":{n:"HRV 心率變異度",c:"HRV",s:"連續心跳之間時間間隔的變化程度。",def:"連續心跳之間時間間隔的變化程度。心跳並不是完全等距的，間隔會隨呼吸與自律神經的活動而改變。",role:"本研究以 HRV 作為身體放鬆程度的量化基礎：間隔的變化越大，通常代表副交感神經越活躍、身體越放鬆。"},
"g-rr":{n:"RR 間期",c:"RR",s:"相鄰兩個 R 波之間的時間（毫秒）。",def:"心電圖中相鄰兩個 R 波（每次心跳最高的尖峰）之間的時間，單位是毫秒（ms）。",role:"Polar H10 胸式心率帶透過 BLE 逐拍傳送 RR 間期給 Raspberry Pi 5，是所有 HRV 計算的原始資料。"},
"g-rmssd":{n:"RMSSD",c:"RMSSD",s:"連續心跳間期差異的均方根。",def:"Root Mean Square of Successive Differences，連續心跳間期差異的均方根：先算相鄰 RR 間期的差，平方後取平均，再開根號。",role:"本研究的主要生理指標，以 60 秒滑動視窗計算；介入前後的 RMSSD 變化就是 AI 的獎勵來源。",x:"RMSSD = √( Σ (RRᵢ₊₁ − RRᵢ)² ÷ N )"},
"g-ans":{n:"交感與副交感神經",c:"自律神經",s:"像蹺蹺板一樣此消彼長的兩套神經系統。",def:"自律神經分為交感神經（戰或逃、心跳加快）與副交感神經（休息與修復）。兩者此消彼長，就像一個蹺蹺板。",role:"RMSSD 反映副交感神經的活性；RMSSD 上升，代表身體正在進入放鬆狀態。"},
"g-rl":{n:"強化學習",c:"RL",s:"讓 AI 透過試誤，學會長期最有利的選擇。",def:"讓 AI 透過「試誤」學習的方法：做出動作、觀察環境回饋的獎勵，逐步學會長期最有利的選擇。",role:"AI 每場選擇一種音光組合（動作），以介入後的 RMSSD 變化作為獎勵，替每位使用者學出個人化的放鬆方案。"},
"g-qlearn":{n:"Q-learning",c:"Q(a)",s:"用 Q 值記錄每個動作有多好，並隨獎勵更新。",def:"強化學習的一種方法。替每個動作維護一個 Q 值，代表「選這個動作預期有多好」，每次拿到獎勵就把 Q 值往獎勵靠近一步。",role:"本研究採用簡化的 Q-learning：每場只更新被選中方案的 Q 值，學習率 α 固定為 0.3。",x:"Q(a) ← Q(a) + α × (R − Q(a))，α = 0.3"},
"g-bandit":{n:"多臂老虎機 Bandit",c:"Bandit",s:"不知道哪台機器最好，只能邊試邊學。",def:"經典的決策問題：面前有好幾台吃角子老虎機，不知道哪一台的獎勵最高，只能一邊拉、一邊記錄結果。",role:"四種音光組合 A1–A4 就是四台機器。每人只有 10 場的小樣本下，Bandit 形式比完整狀態空間的 Q-learning 更容易收斂。"},
"g-egreedy":{n:"ε-greedy 策略",c:"ε",s:"在探索新方案與利用最佳方案之間取平衡。",def:"在「探索」與「利用」之間取得平衡的策略：以 ε 的機率隨機嘗試其他方案，其餘時間選擇目前 Q 值最高的方案。",role:"本研究第 7–10 場使用 ε = 0.2；第 1–2 場固定 A2 當控制基線，第 3–6 場依序探索 A1 → A4。"},
"g-reward":{n:"Reward 獎勵",c:"R",s:"告訴 AI 這次的選擇好不好的分數。",def:"強化學習中評價一次動作好壞的數值。獎勵越高，AI 就越傾向再次選擇這個動作。",role:"原始公式為「介入期 RMSSD − 壓力期 RMSSD」；修正後的分析公式改為「介入期 RMSSD − 日常基線」，不受壓力誘發成功與否影響。"},
"g-stroop":{n:"Stroop 色字測驗",c:"Stroop",s:"說出字的顏色而不是字義，製造輕度壓力。",def:"畫面顯示代表顏色的字，但字的墨水顏色不同，受試者要說出墨水的顏色。字義與顏色互相衝突，造成認知負荷。",role:"本研究在第 3–6 分鐘用 Stroop 誘發輕度壓力；Pilot 觀察到校園情境的誘發成功率約 20%，因此修正了 reward 公式。"},
"g-ectopic":{n:"Ectopic beat 過濾",c:"Ectopic",s:"把偶發的異常心跳挑出來並修正。",def:"異位搏動（ectopic beat）是偶發、不規則的心跳，會讓 RR 間期突然變長或變短。",role:"相鄰 RR 差超過 200 ms 時判定為異常，改用滑動視窗的中位數取代，避免 RMSSD 被少數異常值拉偏。"},
"g-window":{n:"60 秒滑動視窗",c:"60 s",s:"每次只看最近 60 秒的資料，持續更新。",def:"每次只取最近一段固定長度的資料來計算，視窗隨時間往前移動，結果也跟著持續更新。",role:"RMSSD 以 60 秒滑動視窗計算，對齊 1996 年 Task Force 的短時 HRV 標準。"},
"g-edge":{n:"Edge RL 邊緣運算",c:"Edge",s:"AI 的運算都在裝置本地完成，不上雲端。",def:"把運算放在資料產生的裝置旁邊（邊緣）完成，而不是把資料傳到遠端的雲端伺服器。",role:"所有 HRV 計算與 Q-learning 都在 Raspberry Pi 5 本地完成：保護隱私、避免網路延遲，也能在學校或家中獨立運作。"},
"g-nof1":{n:"N-of-1 個案研究",c:"N-of-1",s:"把一個人當作一個完整的實驗。",def:"以單一個人作為完整的實驗對象：同一個人重複多次，和自己比較，而不是取很多人的平均。",role:"每位受試者進行 10 場 session，找出屬於他的最佳放鬆方案，呼應精準醫療「因人而異」的精神。"}
};
